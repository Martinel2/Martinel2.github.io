<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>포트폴리오 편집</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f9;color:#172b3a;font:15px/1.6 system-ui}button,input,textarea{font:inherit}button{cursor:pointer;border:1px solid #cbd5df;border-radius:8px;padding:9px 14px;background:white;color:inherit}button:disabled{opacity:.5;cursor:default}button.primary{background:#193e50;color:white;border-color:#193e50}a{color:#185e80}header{position:sticky;top:0;z-index:2;background:#fff;border-bottom:1px solid #dbe1e7;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}header h1{font-size:20px;margin:0}header p{font-size:13px;margin:3px 0 0;color:#627280}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.layout{display:grid;grid-template-columns:250px minmax(0,900px);gap:32px;max-width:1240px;margin:auto;padding:24px}nav{align-self:start;position:sticky;top:110px;max-height:calc(100vh - 130px);overflow:auto}nav h2{font-size:12px;color:#71808c;margin:20px 8px 6px}nav button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 12px;font-size:14px}nav button[aria-current=true]{background:#dfebf0;color:#123f56;font-weight:700}main{min-width:0;background:#fff;padding:28px;border:1px solid #e1e7ec;border-radius:12px}h2{margin-top:0}h3{font-size:16px}label{display:block;font-weight:600;margin:0 0 7px}textarea{display:block;width:100%;resize:vertical;min-height:44px;border:1px solid #c7d2dd;border-radius:7px;padding:10px 12px;line-height:1.7;background:#fff;color:#1a2b38}textarea:focus{outline:2px solid #3884aa;outline-offset:1px}.field{margin:0 0 22px}.group{border-left:3px solid #e0e8ed;padding:0 0 0 16px;margin:24px 0}.group h3{color:#3b596c}.help{color:#687a88;font-size:13px}.notice{margin:18px 24px;padding:12px 16px;background:#e8f1f7;border-radius:8px}.notice:empty{display:none}#status[role=alert]{background:#fff0e9}.image{max-width:100%;max-height:220px;object-fit:contain;border:1px solid #ddd}dialog{max-width:780px;width:calc(100% - 32px);max-height:85vh;border:0;border-radius:12px;padding:24px;box-shadow:0 20px 80px #0004}dialog::backdrop{background:#13273799}.change{border-bottom:1px solid #ddd;padding:12px 0}.change p{white-space:pre-wrap;overflow-wrap:anywhere;margin:5px 0}.before{color:#7e5353}.after{color:#205944}.dialog-actions{position:sticky;bottom:-24px;background:white;padding:16px 0;display:flex;gap:10px}details{margin:0 24px 16px}code{overflow-wrap:anywhere}#changes{overflow-wrap:anywhere}@media(max-width:760px){header{padding:12px}.layout{display:block;padding:12px}nav{position:static;max-height:230px;margin-bottom:18px}main{padding:18px}.notice{margin:12px}header h1{font-size:18px}}
</style><script src="/admin/editor.js" defer></script></head><body>
<header><div><h1>포트폴리오 편집</h1><p id="dirty">내용을 불러오는 중입니다.</p></div><div class="actions"><label for="content-language">편집할 언어 </label><select id="content-language"><option value="ko">한국어</option><option value="en">영어</option></select><a href="https://martinel2.github.io/" target="_blank" rel="noopener">사이트 보기 ↗</a><button id="reload" disabled>다시 불러오기</button><button id="backup" disabled>수정본 백업</button><button id="review" class="primary" disabled>변경 확인·저장</button></div></header>
<p id="status" class="notice" role="status" aria-live="polite"></p>

<div class="layout"><nav id="menu" aria-label="편집할 내용"></nav><main><h2 id="section-title">내용 편집</h2><p class="help">문장을 수정한 뒤 변경 내용을 확인하고 저장하세요. 저장 후 사이트 반영까지 잠시 걸립니다. 기존 항목의 내용과 링크를 편집할 수 있습니다.</p><p id="section-help" class="help"></p><p id="intro-preview" style="white-space:pre-line;font-size:20px;font-weight:600" hidden></p><div id="fields"></div></main></div>
